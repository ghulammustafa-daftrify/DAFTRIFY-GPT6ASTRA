name: Step 4 Final Polish
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Step 4 final polish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Step 4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.world{will-change:contents}', '.world{will-change:transform}')
          m=re.search(r'function draw\(\)\{.*?requestAnimationFrame\(draw\)\}',s,re.S)
          if not m: raise SystemExit('draw() block not found')
          new=r'''function draw(){
            t+=.008;const p=current,w=W,h=H,cx=w*.64,cy=h*.5;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0c0f0c';ctx.fillRect(0,0,w,h);
            const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,w*.7);grd.addColorStop(0,'#1b2821');grd.addColorStop(.5,'#101711');grd.addColorStop(1,'#0c0f0c');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);
            const q=p*5,idx=Math.min(5,Math.floor(q)),local=q-idx,u=local*local*(3-2*local);ctx.save();ctx.translate(mouse.x*w*.025,mouse.y*h*.02);const docX=cx+w*.02,docY=cy-h*.01;
            if(idx===0&&local<.45){paper(docX+w*.10*(1-u),docY,w*.27*(.92+.08*u),h*.48*(.92+.08*u),-.035+.015*u,1,0,false)}
            else if(idx===0){paper(docX,docY,w*.27,h*.48,-.02,1,1,false);paper(docX-w*.12*u,docY+h*.04*u,w*.21,h*.37,.08,.55*u,0,false)}
            else if(idx===1){paper(docX,docY,w*.27,h*.48,-.02+.005*u,1,1,false);ctx.strokeStyle='#b8d2c280';ctx.lineWidth=1*dpr;for(let i=0;i<5;i++){const yy=docY-h*.14+i*h*.065;ctx.beginPath();ctx.moveTo(docX+w*.19,yy);ctx.lineTo(docX+w*.31+Math.sin(t+i)*w*.018,yy);ctx.stroke()}for(let i=0;i<4;i++){ctx.fillStyle='#b8d2c2';ctx.globalAlpha=.45+.4*Math.sin(t*2+i);ctx.fillRect(docX+w*.27,docY-h*.14+i*h*.065,4*dpr,4*dpr)}}
            else if(idx===2){paper(docX,docY,w*.27,h*.48,-.015+.005*u,1,2,false);ctx.strokeStyle='#b8d2c260';ctx.lineWidth=1*dpr;ctx.strokeRect(docX-w*.085,docY-h*.19,w*.17,h*.38);ctx.fillStyle='#66786d';for(let i=0;i<4;i++)ctx.fillRect(docX-w*.06,docY-h*.13+i*h*.07,w*.12,2*dpr);ctx.fillStyle='#b8d2c2';ctx.fillRect(docX+w*.055,docY+h*.075,w*.045,5*dpr)}
            else if(idx===3){const spread=1-u;paper(docX-w*.16*spread,docY,w*.24,h*.43,.055,1,3,false);paper(docX+w*.16*spread,docY,w*.24,h*.43,-.055,1,3,true);ctx.strokeStyle='#d49b91aa';ctx.lineWidth=1*dpr;ctx.beginPath();ctx.moveTo(docX-w*.025,docY-h*.10);ctx.lineTo(docX+w*.025,docY-h*.10);ctx.stroke();ctx.beginPath();ctx.moveTo(docX-w*.025,docY+h*.015);ctx.lineTo(docX+w*.025,docY+h*.015);ctx.stroke();ctx.fillStyle='#d49b91';ctx.beginPath();ctx.arc(docX,docY+h*.11,4*dpr,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.55+.35*Math.sin(t*2);ctx.strokeStyle='#d49b9180';ctx.beginPath();ctx.arc(docX,docY+h*.11,10*dpr,0,Math.PI*2);ctx.stroke()}
            else if(idx===4){paper(docX,docY,w*.28,h*.49,-.01+.002*u,1,4,false);ctx.strokeStyle='#b8d2c280';ctx.lineWidth=1*dpr;ctx.strokeRect(docX-w*.105,docY-h*.205,w*.21,h*.41);for(let i=0;i<3;i++){const yy=docY-h*.11+i*h*.085;ctx.strokeStyle=i===1?'#d49b91aa':'#b8d2c260';ctx.beginPath();ctx.moveTo(docX-w*.075,yy);ctx.lineTo(docX+w*.075,yy);ctx.stroke()}ctx.fillStyle='#b8d2c2';ctx.beginPath();ctx.arc(docX+w*.09,docY+h*.14,5*dpr,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8d2c260';ctx.beginPath();ctx.arc(docX+w*.09,docY+h*.14,12*dpr,0,Math.PI*2);ctx.stroke()}
            else{paper(docX,docY,w*.31,h*.53,-.008,1,5,false);ctx.strokeStyle='#b8d2c275';ctx.lineWidth=1*dpr;ctx.strokeRect(docX-w*.125,docY-h*.22,w*.25,h*.44);ctx.fillStyle='#b8d2c2';ctx.fillRect(docX+w*.075,docY-h*.19,7*dpr,7*dpr);ctx.strokeStyle='#b8d2c270';ctx.beginPath();ctx.moveTo(docX-w*.085,docY+h*.12);ctx.lineTo(docX-w*.015,docY+h*.17);ctx.lineTo(docX+w*.10,docY+h*.02);ctx.stroke();ctx.globalAlpha=.18+.12*Math.sin(t*1.5);ctx.strokeStyle='#b8d2c2';ctx.beginPath();ctx.arc(docX,docY,Math.min(w,h)*.25,0,Math.PI*2);ctx.stroke()}
            ctx.restore();const scanY=h*(.22+.56*((t+p*1.6)%1));ctx.fillStyle='#b8d2c212';ctx.fillRect(0,scanY,w,1*dpr);if(p>.12&&p<.9){ctx.fillStyle='#b8d2c208';ctx.fillRect(cx-w*.24,cy-h*.29,w*.48,h*.58)}requestAnimationFrame(draw)}'''
          s=s[:m.start()]+new+s[m.end():]
          p.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          test -f index.html
          grep -q 'Step 4' index.html
          grep -q 'function draw()' index.html
          grep -q 'RECEIVE' index.html
          grep -q 'PACKAGE' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); js=re.search(r'<script>(.*?)</script>',s,re.S).group(1); Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit final polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Step 4 final polish: smooth scroll narrative transitions'
          git push
