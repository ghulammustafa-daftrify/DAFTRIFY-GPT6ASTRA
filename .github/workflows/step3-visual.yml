name: Step 3 visual cleanup
on:
  push:
    paths:
      - '.github/workflows/step3-visual.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine visual system
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* Step 3 visual system: deliberate variation, artifact-first UI, no generic SaaS treatment */'
          css='''\n          /* Step 3 visual system: deliberate variation, artifact-first UI, no generic SaaS treatment */\n          .navcta,.button{border-radius:2px}.button{box-shadow:none}.navcta{padding:10px 13px}.brandmark{border-radius:0}.hero-actions{gap:24px}\n          .button{transition:transform .18s ease,background-color .18s ease,border-color .18s ease}.button:hover{transform:translateY(-2px);background:#fff}\n          .textlink{transition:color .18s ease,border-color .18s ease}.textlink:hover{color:#fff;border-color:#fff}\n          .friction div{padding:24px 18px 22px}.friction div:nth-child(2),.friction div:nth-child(4){background:#121510}\n          .method-row{transition:background-color .18s ease,border-color .18s ease}.method-row:hover{background:#121510}.demo-shell{box-shadow:none}\n          .doc{position:relative}.doc:first-child:after{content:'SOURCE';position:absolute;right:20px;top:18px;font:9px var(--mono);letter-spacing:.12em;color:#9b988d}.doc:last-child:after{content:'RECONCILED';position:absolute;right:20px;top:18px;font:9px var(--mono);letter-spacing:.12em;color:#73897d}\n          .tool,.fit-card{border-radius:0}.tool svg{opacity:.72}.tool{transition:background-color .18s ease}.tool:hover{background:#121510}.fit-card{transition:background-color .18s ease}.fit-card:hover{background:#e7e3d8}\n          .cta-section{text-align:left}.cta-section h2,.cta-section .copy{margin-left:0}.cta-section .copy{margin-top:22px;margin-bottom:30px}.form{margin-left:0}.form input,.form textarea{min-height:44px;font-size:var(--type-body);line-height:1.5;transition:border-color .18s ease,background-color .18s ease}.form input:focus,.form textarea:focus{border-color:#8fa99a;background:#ffffff0d;box-shadow:0 0 0 2px #b8d2c21a}\n          @media(max-width:850px){.chapter-grid{grid-template-columns:1fr;gap:42px}.friction{grid-template-columns:1fr 1fr}.friction div:nth-child(2){border-right:0}.tools,.fit-grid{grid-template-columns:1fr}.tool{min-height:240px}.tool-head{display:block}.tool-head .copy{margin-top:20px}.demo-body{grid-template-columns:1fr}.doc+.doc{border-left:0;border-top:1px solid #cbc6b8}.timeline{width:52vw}.cta-section{text-align:left}.foot{flex-direction:column}}\n          @media(max-width:560px){.friction{grid-template-columns:1fr}.friction div{border-right:0;border-bottom:1px solid #383a34;min-height:auto}.friction div:nth-child(2),.friction div:nth-child(4){background:transparent}.tools{margin-top:38px}.tool{padding:24px}.tool svg{margin-bottom:34px}.fit-card{min-height:160px}.fit-card h3{margin-top:28px}.demo-shell{margin-top:38px}.doc{padding:26px 22px}.doc:after{display:none}.timeline{width:calc(100% - 2*var(--g));right:var(--g)}}\n          @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}.button:hover{transform:none}}\n          '''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/step3-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/step3-visual.yml
          git commit -m 'Step 3: refine visual system and remove generic UI patterns'
          git push