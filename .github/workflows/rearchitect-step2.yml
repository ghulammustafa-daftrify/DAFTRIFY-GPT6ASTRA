name: DAFTRIFY Step 2 Typography Rearchitecture
on:
  workflow_dispatch:
  push:
    paths:
      - _rearchitect_step2.trigger
permissions:
  contents: write
jobs:
  rearchitect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography system
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* Step 2 — DAFTRIFY Typography System v2 */
          :root{
            --type-display:clamp(64px,7.2vw,112px);
            --type-h1:clamp(48px,5.4vw,78px);
            --type-h2:clamp(38px,4.4vw,60px);
            --type-h3:clamp(20px,1.65vw,24px);
            --type-body-lg:18px;
            --type-body:16px;
            --type-small:13px;
            --type-label:12px;
            --type-mono:10px;
          }
          body{font-size:var(--type-body);line-height:1.6}
          h1,h2,h3{ text-wrap:balance }
          p{ text-wrap:pretty }
          h1{font-size:var(--type-display);line-height:.9;letter-spacing:-.045em}
          h2{font-size:var(--type-h2);line-height:1;letter-spacing:-.04em}
          h3{font-size:var(--type-h3);line-height:1.12;letter-spacing:-.015em}
          .copy{max-width:62ch;font-size:var(--type-body);line-height:1.68}
          .mono{font-size:var(--type-mono);line-height:1.5;letter-spacing:.14em}
          nav a{font-size:var(--type-mono);line-height:1.4;letter-spacing:.11em}
          .brand{font-size:14px;line-height:1.2}
          .button{font-size:var(--type-label);line-height:1.25;font-weight:600}
          .textlink{font-size:var(--type-mono);line-height:1.4}
          .hero-left{width:min(650px,60vw)}
          .hero-left .mono{margin-bottom:20px}
          .hero-left .copy{margin-top:26px;max-width:58ch}
          .hero-actions{margin-top:30px}
          .index{font-size:var(--type-mono);line-height:1.5;margin-bottom:18px}
          .manifesto{font-size:clamp(32px,4vw,56px);line-height:1.06;letter-spacing:-.035em}
          .friction b{font-size:var(--type-label);line-height:1.35}
          .friction p{font-size:var(--type-small);line-height:1.62}
          .method-row h3{font-size:var(--type-h3);line-height:1.12}
          .method-row p{font-size:var(--type-small);line-height:1.62}
          .method-row .num,.method-row .state{font-size:var(--type-mono);line-height:1.5}
          .doc .label{font-size:var(--type-mono);line-height:1.5}
          .field b{font-size:var(--type-label);line-height:1.35}
          .field span{font-size:var(--type-mono);line-height:1.5}
          .flag{font-size:var(--type-small);line-height:1.6}
          .check{font-size:var(--type-small);line-height:1.5}
          .tool h3{font-size:clamp(26px,2vw,30px);line-height:1.06}
          .tool p{font-size:var(--type-small);line-height:1.62}
          .tool small,.tool .flow{font-size:var(--type-mono);line-height:1.5}
          .fit-card h3{font-size:clamp(26px,2vw,30px);line-height:1.06}
          .fit-card p{font-size:var(--type-small);line-height:1.62}
          .form label{font-size:var(--type-mono);line-height:1.5}
          .form input,.form textarea{font-size:var(--type-body);line-height:1.5}
          .demo-foot,.foot{font-size:var(--type-mono);line-height:1.5}
          .phase{font-size:var(--type-mono);line-height:1.4}
          .scene-label,.persistent-note{font-size:var(--type-mono);line-height:1.5}
          @media(max-width:850px){
            :root{--type-display:clamp(52px,12vw,78px);--type-h2:clamp(36px,8vw,52px)}
            .hero-left{width:90vw}
            .hero-left h1{font-size:var(--type-display);line-height:.94}
            .hero-left .copy{max-width:38ch}
            .copy{font-size:16px;line-height:1.68}
            .manifesto{font-size:clamp(30px,7vw,46px)}
          }
          @media(max-width:560px){
            :root{--type-display:clamp(48px,13vw,64px);--type-h2:clamp(34px,9vw,44px)}
            .hero-left{width:100%}
            .hero-left .copy{max-width:34ch}
            .friction p,.method-row p,.tool p,.fit-card p{font-size:13px}
            .phase{font-size:9px}
          }
          @media(prefers-reduced-motion:reduce){h1,h2,h3,p{ text-wrap:pretty }}
          '''
          marker='</style>'
          if 'DAFTRIFY Typography System v2' not in s:
              s=s.replace(marker, css+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -s index.html
          grep -q 'DAFTRIFY Typography System v2' index.html
          grep -q 'text-wrap:balance' index.html
      - name: Commit Step 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Step 2: re-architect typography system'
          git push
