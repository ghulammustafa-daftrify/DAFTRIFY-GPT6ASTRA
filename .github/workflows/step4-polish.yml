name: Step 4 Polish
on:
  push:
    paths:
      - '.github/step4-polish-trigger'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply motion polish
        run: python scripts/step4_polish.py
      - name: Commit changes
        run: |
          git config user.name 'daftrify-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Step 4: deepen document-state motion' || exit 0
          git push
      - name: Remove build files
        if: success()
        run: |
          rm -f .github/workflows/step4-polish.yml .github/step4-polish-trigger scripts/step4_polish.py
          git add -A
          git commit -m 'chore: remove Step 4 build files' || exit 0
          git push
