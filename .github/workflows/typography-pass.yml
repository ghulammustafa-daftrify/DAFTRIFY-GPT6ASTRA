name: DAFTRIFY Step 2 Typography Pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  typography:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply typography hierarchy
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            (r"h1\{font-size:clamp\(56px,7\.5vw,112px\);line-height:\.9\}", "h1{font-size:clamp(54px,6.8vw,100px);line-height:.92}"),
            (r"h2\{font-size:clamp\(40px,5\.2vw,70px\);line-height:\.98\}", "h2{font-size:clamp(38px,4.8vw,64px);line-height:1.02}"),
            (r"h1,h2\{font-family:var\(--serif\);font-weight:400;letter-spacing:-\.04em\}", "h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.045em}"),
            (r"\.mono\{font:500 10px/1\.4 var\(--mono\);letter-spacing:\.13em;text-transform:uppercase\}", ".mono{font:500 9.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase}"),
            (r"\.copy\{max-width:60ch;font-size:16px;line-height:1\.7;color:#b0b2aa\}", ".copy{max-width:60ch;font-size:15.5px;line-height:1.72;color:#b0b2aa}"),
            (r"\.brand\{display:flex;gap:11px;align-items:center;font-weight:600\}", ".brand{display:flex;gap:11px;align-items:center;font-size:14px;font-weight:600;letter-spacing:-.01em}"),
            (r"nav a\{font:10px var\(--mono);letter-spacing:\.1em;text-transform:uppercase;color:#aaa\}", "nav a{font:9.5px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:#aaa}"),
            (r"\.hero-left \.mono\{margin-bottom:21px;color:#aaa\}", ".hero-left .mono{margin-bottom:18px;color:#aaa}"),
            (r"\.hero-left \.copy\{margin-top:26px\}", ".hero-left .copy{margin-top:24px}"),
            (r"\.hero-actions\{display:flex;gap:20px;align-items:center;margin-top:30px\}", ".hero-actions{display:flex;gap:20px;align-items:center;margin-top:28px}"),
            (r"\.textlink\{font:11px var\(--mono);", ".textlink{font:10px var(--mono);"),
            (r"\.index\{font:500 10px var\(--mono\);color:#777;margin-bottom:18px\}", ".index{font:500 9.5px var(--mono);color:#777;margin-bottom:16px}"),
            (r"\.manifesto\{font:clamp\(32px,4\.4vw,62px\);font-family:var\(--serif\);line-height:1\.06;max-width:900px\}", ".manifesto{font:clamp(30px,3.8vw,54px);font-family:var(--serif);line-height:1.08;max-width:900px;letter-spacing:-.035em}"),
            (r"\.friction b\{font-size:13px\}", ".friction b{font-size:12.5px;font-weight:600;letter-spacing:-.01em}"),
            (r"\.friction p\{font-size:11px;line-height:1\.65;", ".friction p{font-size:11px;line-height:1.7;"),
            (r"\.method-row h3\{font-size:19px;font-weight:500\}", ".method-row h3{font-size:18px;font-weight:500;letter-spacing:-.01em}"),
            (r"\.method-row p\{max-width:55ch;color:#8d9088;font-size:12px;line-height:1\.65;", ".method-row p{max-width:55ch;color:#8d9088;font-size:12px;line-height:1.7;"),
            (r"\.method-row \.state\{text-align:right;font:9px var\(--mono);", ".method-row .state{text-align:right;font:8.5px var(--mono);"),
            (r"\.demo-top\{display:flex;justify-content:space-between;padding:15px 18px;", ".demo-top{display:flex;justify-content:space-between;padding:14px 18px;"),
            (r"\.doc \.label\{font:10px var\(--mono);", ".doc .label{font:9.5px var(--mono);"),
            (r"\.field b\{display:block;font-size:13px\}", ".field b{display:block;font-size:12.5px;font-weight:600}"),
            (r"\.field span\{display:block;font:12px var\(--mono);", ".field span{display:block;font:11px var(--mono);"),
            (r"\.flag\{margin-top:20px;padding:14px;border-left:2px solid #a55f56;background:#ded8cd;font-size:11px;line-height:1\.65\}", ".flag{margin-top:20px;padding:14px;border-left:2px solid #a55f56;background:#ded8cd;font-size:11px;line-height:1.7}"),
            (r"\.check\{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid #d1ccc0;font-size:12px;line-height:1\.45\}", ".check{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid #d1ccc0;font-size:11.5px;line-height:1.5}"),
            (r"\.tool h3\{font:500 27px var\(--serif\)\}", ".tool h3{font:500 25px var(--serif);letter-spacing:-.025em}"),
            (r"\.tool p\{font-size:12px;line-height:1\.7;", ".tool p{font-size:11.5px;line-height:1.72;"),
            (r"\.fit-card h3\{font:400 26px var\(--serif\);margin-top:40px\}", ".fit-card h3{font:400 25px var(--serif);letter-spacing:-.02em;margin-top:38px}"),
            (r"\.fit-card p\{font-size:11px;line-height:1\.6;", ".fit-card p{font-size:11px;line-height:1.68;"),
            (r"\.form label\{display:block;font:9px var\(--mono);", ".form label{display:block;font:8.5px var(--mono);"),
            (r"\.foot\{border-top:1px solid var\(--line\);padding:26px var\(--g\) 40px;display:flex;justify-content:space-between;gap:20px;color:#676b64;font:9px var\(--mono)\}", ".foot{border-top:1px solid var(--line);padding:26px var(--g) 40px;display:flex;justify-content:space-between;gap:20px;color:#676b64;font:8.5px var(--mono);letter-spacing:.04em}"),
            (r"\.hero-left h1\{font-size:clamp\(52px,13vw,92px\)\}", ".hero-left h1{font-size:clamp(48px,12vw,82px);line-height:.94}"),
            (r"\.phase\{font:9px var\(--mono);", ".phase{font:8.5px var(--mono);"),
            (r"\.phase\{font-size:7px\}", ".phase{font-size:7px;letter-spacing:.02em}"),
          ]
          before = s
          for pattern, repl in replacements:
              s, n = re.subn(pattern, repl, s, count=1)
              if n != 1:
                  print('MISS', pattern)
          # Add a compact type-system guard immediately before the first media query.
          marker = '@media(max-width:850px)'
          guard = "/* Step 2: typography hierarchy guardrails */\n.mono{white-space:normal}.copy{overflow-wrap:break-word}.button{letter-spacing:-.01em}.hero-left h1 em,.chapter h2 em,.manifesto em{font-style:italic}.tool h3,.fit-card h3,.method-row h3{line-height:1.08}\n"
          if guard not in s:
              s = s.replace(marker, guard + marker, 1)
          if s == before:
              raise SystemExit('No typography changes applied')
          p.write_text(s, encoding='utf-8')
      - name: Commit Step 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Step 2: refine typography hierarchy"
          git push
