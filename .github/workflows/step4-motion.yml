name: Step 4 Motion
on:
  push:
    paths:
      - '.github/step4-trigger'
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply motion system
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* Step 4 — scroll narrative system */\n.hero-pin{will-change:transform}.world{will-change:contents}.hero-left{will-change:transform,opacity}.timeline-line i{transition:none}.phase{will-change:color,opacity}.hero-meta,.scene-label,.persistent-note,.timeline{will-change:transform,opacity}\n.hero-pin:after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 68% 48%,transparent 0,transparent 36%,#0c0f0c22 70%,#0c0f0c66 100%);opacity:.7}\n@media(prefers-reduced-motion:reduce){.hero-pin:after{display:none}}\n'''
          s=s.replace('\n</style>',css+'\n</style>',1)
          old="""function update(){const rect=hero.getBoundingClientRect();target=clamp(-rect.top/(hero.offsetHeight-innerHeight));current+=(target-current)*.12;const q=current*5;const idx=Math.min(5,Math.floor(q));fill.style.width=(current*100).toFixed(1)+'%';percent.textContent=String(Math.round(current*100)).padStart(2,'0')+'%';state.textContent=labels[idx];scene.textContent=sceneLabels[idx];phases.forEach((x,i)=>x.classList.toggle('active',i===Math.min(4,idx)));if(!reduced){left.style.transform=`translate3d(0,${-current*75}px,0)`;left.style.opacity=String(1-current*.55)}head.classList.toggle('scrolled',scrollY>20);requestAnimationFrame(update)}"""
          new="""function update(){const rect=hero.getBoundingClientRect();target=clamp(-rect.top/(hero.offsetHeight-innerHeight));current+=(target-current)*.12;const q=current*5;const idx=Math.min(5,Math.floor(q));const local=q-idx;fill.style.width=(current*100).toFixed(1)+'%';percent.textContent=String(Math.round(current*100)).padStart(2,'0')+'%';state.textContent=labels[idx];scene.textContent=sceneLabels[idx];phases.forEach((x,i)=>{x.classList.toggle('active',i<=Math.min(4,idx));x.style.opacity=i<=idx?'1':'.42'});if(!reduced){const intro=clamp(current/.12);const outro=clamp((current-.82)/.18);const motionEase=ease(current);left.style.transform=`translate3d(0,${-motionEase*110}px,0) scale(${1-motionEase*.035})`;left.style.opacity=String(1-intro*.1-outro*.9);const uiShift=Math.sin(current*Math.PI)*10;document.querySelector('.hero-meta').style.transform=`translate3d(0,${-uiShift}px,0)`;document.querySelector('.timeline').style.transform=`translate3d(0,${uiShift}px,0)`;document.querySelector('.scene-label').style.opacity=String(.45+Math.sin(current*Math.PI)*.55);document.querySelector('.persistent-note').style.opacity=String(1-current*.45)}head.classList.toggle('scrolled',scrollY>20);requestAnimationFrame(update)}"""
          if old not in s: raise SystemExit('target update function not found')
          s=s.replace(old,new)
          marker='''          '''
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'daftrify-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Step 4: build scroll-linked narrative motion' || exit 0
          git push
      - name: Remove workflow
        if: success()
        run: |
          rm -f .github/workflows/step4-motion.yml .github/step4-trigger
          git add -A
          git commit -m 'chore: remove Step 4 build workflow' || exit 0
          git push
