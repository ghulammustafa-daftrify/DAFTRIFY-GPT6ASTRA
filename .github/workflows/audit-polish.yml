name: Audit Polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish Step 4 transitions and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove questionable contents hint; keep only properties that help actual compositing.
          s=s.replace('.world{will-change:contents}', '.world{will-change:transform}')
          # Replace the hard phase-switch renderer with interpolated document states.
          start=s.find('function draw(){')
          end=s.find('requestAnimationFrame(draw)}', start)
          if start < 0 or end < 0:
              raise SystemExit('draw function markers not found')
          end += len('requestAnimationFrame(draw)}')
          new_draw=r'''function draw(){t+=.008;const p=current,w=W,h=H,cx=w*.64,cy=h*.5;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0c0f0c';ctx.fillRect(0,0,w,h);const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,w*.7);grd.addColorStop(0,'#1b2821');grd.addColorStop(.5,'#101711');grd.addColorStop(1,'#0c0f0c');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);const q=p*5,idx=Math.min(4,Math.floor(q)),local=q-idx,fade=ease(local);ctx.save();ctx.translate(mouse.x*w*.025,mouse.y*h*.02);const docX=cx+w*.02,docY=cy-h*.01;
function phaseDoc(i,a){if(i===0){paper(docX+w*.10*(1-a),docY,w*.27,h*.48,-.035,1,0,false);paper(docX-w*.17,docY+h*.06,w*.21,h*.37,.08,.72,0,false)}if(i===1){paper(docX,docY,w*.27,h*.48,-.02,1,1,false);ctx.strokeStyle='#b8d2c280';ctx.lineWidth=1*dpr;for(let j=0;j<5;j++){const yy=docY-h*.14+j*h*.065;ctx.beginPath();ctx.moveTo(docX+w*.19,yy);ctx.lineTo(docX+w*.31+Math.sin(t+j)*w*.018,yy);ctx.stroke()}for(let j=0;j<4;j++){ctx.fillStyle='#b8d2c2';ctx.globalAlpha=.45+.4*Math.sin(t*2+j);ctx.fillRect(docX+w*.27,docY-h*.14+j*h*.065,4*dpr,4*dpr)}}if(i===2){paper(docX,docY,w*.27,h*.48,-.015,1,2,false);ctx.strokeStyle='#b8d2c260';ctx.lineWidth=1*dpr;ctx.strokeRect(docX-w*.085,docY-h*.19,w*.17,h*.38);ctx.fillStyle='#66786d';for(let j=0;j<4;j++)ctx.fillRect(docX-w*.06,docY-h*.13+j*h*.07,w*.12,2*dpr);ctx.fillStyle='#b8d2c2';ctx.fillRect(docX+w*.055,docY+h*.075,w*.045,5*dpr)}if(i===3){paper(docX-w*.16,docY,w*.24,h*.43,.055,1,3,false);paper(docX+w*.16,docY,w*.24,h*.43,-.055,1,3,true);ctx.strokeStyle='#d49b91aa';ctx.lineWidth=1*dpr;ctx.beginPath();ctx.moveTo(docX-w*.025,docY-h*.10);ctx.lineTo(docX+w*.025,docY-h*.10);ctx.stroke();ctx.beginPath();ctx.moveTo(docX-w*.025,docY+h*.015);ctx.lineTo(docX+w*.025,docY+h*.015);ctx.stroke();ctx.fillStyle='#d49b91';ctx.beginPath();ctx.arc(docX,docY+h*.11,4*dpr,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.55+.35*Math.sin(t*2);ctx.strokeStyle='#d49b9180';ctx.beginPath();ctx.arc(docX,docY+h*.11,10*dpr,0,Math.PI*2);ctx.stroke()}if(i===4){paper(docX,docY,w*.28,h*.49,-.01,1,4,false);ctx.strokeStyle='#b8d2c280';ctx.lineWidth=1*dpr;ctx.strokeRect(docX-w*.105,docY-h*.205,w*.21,h*.41);for(let j=0;j<3;j++){const yy=docY-h*.11+j*h*.085;ctx.strokeStyle=j===1?'#d49b91aa':'#b8d2c260';ctx.beginPath();ctx.moveTo(docX-w*.075,yy);ctx.lineTo(docX+w*.075,yy);ctx.stroke()}ctx.fillStyle='#b8d2c2';ctx.beginPath();ctx.arc(docX+w*.09,docY+h*.14,5*dpr,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8d2c260';ctx.beginPath();ctx.arc(docX+w*.09,docY+h*.14,12*dpr,0,Math.PI*2);ctx.stroke()}}
phaseDoc(idx,fade);if(idx<4&&fade<1){ctx.save();ctx.globalAlpha=1-fade;ctx.translate((idx===0?1:-1)*w*.012*fade,0);phaseDoc(idx+1,fade);ctx.restore()}ctx.restore();const scanY=h*(.22+.56*((t+p*1.6)%1));ctx.fillStyle='#b8d2c212';ctx.fillRect(0,scanY,w,1*dpr);if(p>.12&&p<.9){ctx.fillStyle='#b8d2c208';ctx.fillRect(cx-w*.24,cy-h*.29,w*.48,h*.58)}requestAnimationFrame(draw)}'''
          s=s[:start]+new_draw+s[end:]
          # Keep the update loop's reverse-on-scroll behavior; just avoid animating hidden canvas on reduced-motion.
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Audit polish: smooth Step 4 state interpolation' || true
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/audit-polish.yml
          git commit -m 'Cleanup: remove temporary audit workflow'
          git push